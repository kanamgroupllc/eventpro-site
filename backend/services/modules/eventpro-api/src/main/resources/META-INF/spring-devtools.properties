# Spring DevTools Configuration
# This file configures which JARs/modules are loaded by the base classloader vs restart classloader
# 
# The base classloader loads fixed dependencies that don't change during development
# The restart classloader loads your application code for hot reload
#
# For Spring Data Commons, we ensure it's in the base classloader to prevent
# TypeInformation classpath issues with SpringDoc's QuerydslPredicateOperationCustomizer

# Exclude spring-data-commons from restart classloader (put it in base classloader)
# This ensures TypeInformation is always available and prevents classloading conflicts
restart.exclude.spring-data-commons=/spring-data-commons-.*\.jar
